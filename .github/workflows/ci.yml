name: Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pip-audit pytest-cov

      - name: Run unit and API tests
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=60

      - name: Check formatting
        run: python -m black --check app tests

      - name: Check lint
        run: python -m flake8 app tests

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend checks and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check and production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  migrations:
    name: Alembic migration check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fabbi
          POSTGRES_PASSWORD: fabbi_secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fabbi -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Apply all migrations
        env:
          DATABASE_URL: postgresql+asyncpg://fabbi:fabbi_secret@localhost:5432/postgres
        run: alembic upgrade head

  docker:
    name: Docker configuration and image builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate development compose file
        run: docker compose -f docker-compose.yml config -q

      - name: Validate production compose file
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          JWT_SECRET: ci-jwt-secret
          CORS_ORIGINS: http://localhost:3000
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Build backend image
        run: docker build --tag fabbi-backend:ci ./backend

      - name: Build frontend image
        run: docker build --tag fabbi-frontend:ci ./frontend

  e2e:
    name: Playwright browser journeys
    runs-on: ubuntu-latest
    needs: [backend, frontend, migrations]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up --build --detach

      - name: Wait for backend readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E suite against the compose stack
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          if-no-files-found: ignore

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes
